<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS:GO Case Opening - Gacha For Your Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f1217;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 550px;
            max-height: 900px;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0,0,0,0.8);
            background: #141721;
        }

        /* 1. MÀN HÌNH CHÍNH (TITLE SCREEN) */
        #screen-title {
            position: absolute;
            inset: 0;
            background: url('image_6ecf5e.png') no-repeat center center;
            background-size: cover;
            z-index: 10;
        }

        .sparkle-burst {
            position: absolute;
            width: 22px;
            height: 22px;
            pointer-events: none;
            animation: twinkleBurst 2.8s ease-in-out infinite alternate;
        }
        @keyframes twinkleBurst {
            0% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.3) rotate(45deg); filter: drop-shadow(0 0 8px #fff); }
            100% { opacity: 0.3; transform: scale(0.7) rotate(90deg); }
        }

        .menu-buttons-layer {
            position: absolute;
            top: 58.2%;              /* Căn mép trên trùng khớp nút Play */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;               /* Dùng px cố định để đẩy nút Settings xuống đúng vị trí */
            width: 42.5%;            /* Mở rộng nhẹ bề ngang để mép trái phải khít viền đen */
            z-index: 20;
        }

        .interactive-btn {
            position: relative;
            width: 100%;
            height: 66px;            /* Chiều cao bao trọn cả mặt nút lẫn viền đen */
            background: transparent;
            border: 4.5px solid transparent;
            border-radius: 20px;     /* Bo góc 20px ôm khít đường cong */
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.08s ease, filter 0.08s ease;
        }

        /* Khi click giữ chuột (:active) hoặc hover chuột */
        .interactive-btn:active,
        .interactive-btn:hover {
            animation: flashBorderYellowPurple 0.35s infinite alternate ease-in-out;
        }

        .interactive-btn:active {
            transform: scale(0.98);
        }

        /* Animation luân phiên Vàng - Tím */
        @keyframes flashBorderYellowPurple {
            0% {
                border-color: #ffe600;
                box-shadow: 0 0 14px rgba(255, 230, 0, 0.95), inset 0 0 8px rgba(255, 230, 0, 0.45);
            }
            100% {
                border-color: #d924f7;
                box-shadow: 0 0 16px rgba(217, 36, 247, 0.95), inset 0 0 8px rgba(217, 36, 247, 0.45);
            }
        }

        /* 2. MÀN HÌNH MỞ HÒM CS:GO */
        #screen-game {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            background: radial-gradient(circle at 50% 20%, #1e2433 0%, #0d1017 100%);
            z-index: 30;
            padding: 16px;
            color: #ffffff;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
        }

        .title-badge {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #e5a93b;
            border-radius: 20px;
            padding: 5px 18px;
            color: #ffcd59;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .btn-icon {
            background: #2a3142;
            border: 2px solid #475569;
            border-radius: 12px;
            color: #fff;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 0 #12161f;
        }
        .btn-icon:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #12161f;
        }

        .csgo-case-arena {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .case-preview-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s ease;
        }
        .case-preview-box.spinning-mode {
            transform: scale(0.75) translateY(-15px);
            opacity: 0.85;
        }

        .case-icon {
            font-size: 110px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8));
            animation: caseHover 3s ease-in-out infinite alternate;
            transition: transform 0.2s ease;
        }
        @keyframes caseHover {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }

        .case-shaking {
            animation: shakeBox 0.15s infinite ease-in-out !important;
        }
        @keyframes shakeBox {
            0% { transform: rotate(0deg) scale(1.05); }
            25% { transform: rotate(-5deg) scale(1.08); }
            50% { transform: rotate(0deg) scale(1.05); }
            75% { transform: rotate(5deg) scale(1.08); }
            100% { transform: rotate(0deg) scale(1.05); }
        }

        .case-name {
            font-size: 22px;
            font-weight: 900;
            color: #e5a93b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        .case-loot-preview {
            display: flex;
            gap: 6px;
            margin-top: 14px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: opacity 0.3s ease;
        }
        .loot-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        .roulette-viewport {
            position: relative;
            width: 100%;
            height: 0;
            opacity: 0;
            background: #090b10;
            border-top: 3px solid #2d3648;
            border-bottom: 3px solid #2d3648;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            display: flex;
            align-items: center;
            transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease, margin 0.35s ease;
            margin: 0;
        }

        .roulette-viewport.active {
            height: 150px;
            opacity: 1;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .center-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            transform: translateX(-50%);
            background: #ff3344;
            box-shadow: 0 0 12px #ff2233, 0 0 24px #ff001e;
            z-index: 15;
            pointer-events: none;
        }
        .center-marker::before, .center-marker::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
        }
        .center-marker::before { top: 0; border-top: 9px solid #ff3344; }
        .center-marker::after { bottom: 0; border-bottom: 9px solid #ff3344; }

        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            height: 100%;
            align-items: center;
            will-change: transform;
        }

        .cs-item {
            width: 130px;
            height: 136px;
            margin: 0 4px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #181d28 0%, #10131b 100%);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 8px 6px;
            position: relative;
            overflow: hidden;
            border: 2px solid #232a3a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .cs-item-avatar {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6));
        }

        .cs-item-avatar img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .cs-item-info {
            width: 100%;
            text-align: center;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .cs-item-name {
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #d1d5db;
        }

        .cs-item-sub {
            font-size: 9px;
            font-weight: 700;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cs-rarity-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 5px;
        }

        .rarity-Covert { border-bottom-color: #eb4b4b; }
        .rarity-Covert .cs-rarity-bar { background: #eb4b4b; box-shadow: 0 0 10px #eb4b4b; }

        .rarity-Classified { border-bottom-color: #d32ce6; }
        .rarity-Classified .cs-rarity-bar { background: #d32ce6; box-shadow: 0 0 10px #d32ce6; }

        .rarity-Restricted { border-bottom-color: #8847ff; }
        .rarity-Restricted .cs-rarity-bar { background: #8847ff; }

        .rarity-Mil-Spec { border-bottom-color: #4b69ff; }
        .rarity-Mil-Spec .cs-rarity-bar { background: #4b69ff; }

        .rarity-Special { border: 2px solid #ffd700 !important; background: linear-gradient(180deg, #302613 0%, #121008 100%); }
        .rarity-Special .cs-rarity-bar { background: #ffd700; box-shadow: 0 0 15px #ffd700; }
        .rarity-Special .cs-item-name { color: #ffe875; font-weight: 900; }

        .action-container {
            width: 100%;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-cs-open {
            width: 82%;
            height: 60px;
            background: linear-gradient(180deg, #62b132 0%, #448c1a 100%);
            border: 2px solid #82e240;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 6px 0 #285410, 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.08s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-cs-open:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #285410;
        }
        .btn-cs-open:disabled {
            background: #475569;
            border-color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        /* MODAL KẾT QUẢ KHI MỞ TRÚNG */
        #modal-result {
            position: absolute;
            inset: 0;
            background: rgba(8, 10, 15, 0.94);
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reward-card {
            width: 260px;
            height: 350px;
            background: #151922;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 18px;
            border: 4px solid #fff;
            animation: popReward 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            position: relative;
        }
        @keyframes popReward {
            0% { transform: scale(0.3) rotate(-8deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .reward-avatar {
            width: 135px;
            height: 135px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .reward-avatar img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .reward-info-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .reward-title { 
            font-size: 20px; 
            font-weight: 900; 
            text-align: center; 
        }

        .reward-sub {
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .reward-rarity-badge {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .popup-btn {
            background: linear-gradient(180deg, #ffd34d 0%, #f7b300 45%, #d18700 100%);
            border: 3px solid #111;
            border-radius: 16px;
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            padding: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #000;
            margin-top: 25px;
            width: 200px;
        }
        .popup-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #000;
        }

        /* MODAL KHO ĐỒ & CÀI ĐẶT */
        .game-modal {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-body {
            width: 100%;
            max-width: 440px;
            background: #1a202c;
            border: 3px solid #e5a93b;
            border-radius: 20px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        .cards-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-height: 52vh;
            overflow-y: auto;
            width: 100%;
            padding: 8px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.15);
            font-weight: 700;
        }

        .toggle-switch {
            width: 58px;
            height: 30px;
            background: #475569;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
        }
        .toggle-switch.active { background: #22c55e; }
        .toggle-knob {
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 4px;
            transition: transform 0.2s;
        }
        .toggle-switch.active .toggle-knob { transform: translateX(28px); }

        .btn-small-danger {
            background: #ef4444;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 900;
            padding: 6px 14px;
            cursor: pointer;
        }

        #toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #e11d48;
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 800;
            z-index: 99;
            transition: transform 0.3s ease;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="game-viewport">

        <!-- MÀN HÌNH CHÍNH -->
        <div id="screen-title">
            <svg class="sparkle-burst" style="top: 20%; left: 14%;" viewBox="0 0 100 100">
                <polygon points="50,0 60,38 98,50 60,62 50,100 40,62 2,50 40,38" fill="#ffffff" />
            </svg>
            <svg class="sparkle-burst" style="bottom: 12%; right: 12%; animation-delay: 1.1s;" viewBox="0 0 100 100">
                <polygon points="50,0 60,38 98,50 60,62 50,100 40,62 2,50 40,38" fill="#ffffff" />
            </svg>

            <div class="menu-buttons-layer">
                <button class="interactive-btn" id="btn-play" aria-label="Play"></button>
                <button class="interactive-btn" id="btn-settings" aria-label="Settings"></button>
            </div>
        </div>

        <!-- MÀN HÌNH GACHA CS:GO -->
        <div id="screen-game">
            <div class="hud-header">
                <button class="btn-icon" id="btn-back">⬅</button>
                <div class="title-badge">CHROMA CASE OPENING</div>
                <button class="btn-icon" id="btn-inventory">🎒</button>
            </div>

            <div class="csgo-case-arena">
                <!-- GIAO DIỆN HÒM KHI CHƯA MỞ -->
                <div class="case-preview-box" id="case-preview-box">
                    <div class="case-icon" id="case-icon">📦</div>
                    <div class="case-name">NHÂN VẬT HÔM NAY</div>
                    <div class="case-loot-preview" id="case-loot-preview">
                        <div class="loot-dot" style="background:#ffd700;" title="Special ★"></div>
                        <div class="loot-dot" style="background:#eb4b4b;" title="Covert"></div>
                        <div class="loot-dot" style="background:#d32ce6;" title="Classified"></div>
                        <div class="loot-dot" style="background:#8847ff;" title="Restricted"></div>
                        <div class="loot-dot" style="background:#4b69ff;" title="Mil-Spec"></div>
                    </div>
                </div>

                <!-- BĂNG CHUYỀN ROULETTE -->
                <div class="roulette-viewport" id="roulette-viewport">
                    <div class="center-marker"></div>
                    <div class="roulette-track" id="roulette-track"></div>
                </div>

                <div class="action-container">
                    <button class="btn-cs-open" id="btn-open-case">
                        <span>MỞ HÒM (UNLOCK)</span>
                    </button>
                    <div id="status-hint" style="margin-top: 12px; font-size: 13px; color: #94a3b8; font-weight: 800;">
                        Nhấn nút để bắt đầu mở hòm!
                    </div>
                </div>
            </div>
        </div>

        <!-- POPUP NHẬN THƯỞNG KHI MỞ TRÚNG -->
        <div id="modal-result">
            <div style="font-size: 26px; font-weight: 900; color: #ffbe1a; margin-bottom: 15px;">VẬT PHẨM MỞ ĐƯỢC!</div>
            <div class="reward-card" id="reward-card">
                <div class="reward-rarity-badge" id="reward-rarity">Covert</div>
                <div class="reward-avatar" id="reward-avatar"></div>
                <div class="reward-info-block">
                    <div class="reward-title" id="reward-title"></div>
                    <!-- DÒNG PHỤ Ở ĐÂY -->
                    <div class="reward-sub" id="reward-sub"></div>
                </div>
            </div>
            <button class="popup-btn" id="btn-close-result">Xác Nhận</button>
        </div>

        <!-- POPUP CÀI ĐẶT -->
        <div class="game-modal" id="modal-settings">
            <div class="modal-body">
                <h2 style="text-align: center; color: #e5a93b; margin-bottom: 15px;">CÀI ĐẶT</h2>
                <div class="setting-row">
                    <span>Âm thanh mở hòm & Tích tắc</span>
                    <div class="toggle-switch active" id="toggle-sfx">
                        <div class="toggle-knob"></div>
                    </div>
                </div>
                <div class="setting-row">
                    <span>Xóa toàn bộ kho đồ</span>
                    <button class="btn-small-danger" id="btn-reset">Reset Kho</button>
                </div>
                <button class="popup-btn" id="btn-close-settings" style="width: 100%; margin-top: 20px;">Đóng</button>
            </div>
        </div>

        <!-- POPUP KHO LƯU TRỮ -->
        <div class="game-modal" id="modal-inventory">
            <div class="modal-body">
                <h2 style="text-align: center; color: #e5a93b; margin-bottom: 12px;">🎒 KHO NHÂN VẬT CỦA BẠN</h2>
                <div class="cards-grid" id="inventory-grid"></div>
                <button class="popup-btn" id="btn-close-inventory" style="width: 100%; margin-top: 15px;">Đóng</button>
            </div>
        </div>

        <div id="toast">Thông báo</div>

    </div>

    <!-- SCRIPT VẬN HÀNH BĂNG CHUYỀN -->
    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTick() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(650, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(180, this.ctx.currentTime + 0.04);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.04);
            }

            playFanfare(isGold = false) {
                if (!this.enabled) return;
                this.init();
                const notes = isGold ? [523.25, 659.25, 783.99, 1046.50, 1318.51] : [440, 554.37, 659.25];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = isGold ? 'square' : 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.18, this.ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.4);
                });
            }

            playPop() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            }
        }

        const sound = new SoundEngine();

        // Danh sách nhân vật có thêm trường "sub" hiển thị dòng phụ
        const CSGO_POOL = [
            { 
                id: 1, 
                name: "Lucy Foxx", 
                sub: "She Likes A Big Load",
                rarity: "Special", 
                icon: '<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSri_w6nbdspmpyzRIiQ5UOCyX9dSMUGkW5UReslSLTSsAVK8DYIMGFAJhM&s=10">', 
                color: "#ffd700" 
            },
            { 
                id: 2, 
                name: "Sweetie Fox", 
                sub: "Hot fucking with busty sweetie fox after playing minecraft HD",
                rarity: "Special", 
                icon: '<img src="https://external-preview.redd.it/%D0%B8%D0%B7%D0%B2%D0%B5%D1%81%D1%82%D0%BD%D0%B0%D1%8F-%D0%BB%D0%B5%D1%82%D1%81%D0%BF%D0%BB%D0%B5%D0%B5%D1%80%D1%88%D0%B0-sweetie-fox-%D0%B2%D1%8B%D0%BF%D1%83%D1%81%D1%82%D0%B8%D0%BB%D0%B0-%D0%B2%D1%82%D0%BE%D1%80%D1%83%D1%8E-%D1%87%D0%B0%D1%81%D1%82%D1%8C-c-v0-M2psejVxZmpwZmloMQ0-K_ovz3OEd0pDogJwgv27-GWX-q69pj--mCK0i0bK.jpeg?format=pjpg&auto=webp&s=f7fcc3b9486039711f7c66ade89184d30cb56275">', 
                color: "#ffd700" 
            },
            { 
                id: 3, 
                name: "Comatozze", 
                sub: "I met porn star Comatozze on the street",
                rarity: "Covert", 
                icon: '<img src="https://ic-vt-nss.xhcdn.com/a/NDA3N2Y4NjVmZjJiN2I2NmE0NGQ5ZDI1OTVlN2IyYTU/s(w:1280,h:720),jpeg/026/686/232/1280x720.17495950.jpg">', 
                color: "#eb4b4b" 
            },
            { 
                id: 4, 
                name: "Belle Delphine", 
                sub: "Kidnapping and Fuking in the forest",
                rarity: "Covert", 
                icon: '<img src="https://35express.org/wp-content/uploads/2025/12/Belle-Delphine-1.jpg">', 
                color: "#eb4b4b" 
            }
        ];

        let gameState = { inventory: [] };
        let isSpinning = false;
        const ITEM_CARD_WIDTH = 138;
        const WINNING_INDEX = 48;

        function loadData() {
            try {
                const saved = localStorage.getItem('csgo_case_save');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && Array.isArray(parsed.inventory)) {
                        gameState.inventory = parsed.inventory;
                    }
                }
            } catch(e) {
                gameState.inventory = [];
            }
        }

        function saveData() {
            try {
                localStorage.setItem('csgo_case_save', JSON.stringify(gameState));
            } catch(e) {}
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function getAvailablePool() {
            const ownedIds = new Set(gameState.inventory.map(item => item.id));
            return CSGO_POOL.filter(item => !ownedIds.has(item.id));
        }

        function rollWinningSkin() {
            const available = getAvailablePool();
            if (available.length === 0) return null;

            const special = available.filter(i => i.rarity === "Special");
            const covert = available.filter(i => i.rarity === "Covert");

            const rand = Math.random() * 100;
            let pool = [];

            if (rand <= 10 && special.length > 0) {
                pool = special;
            } else if (covert.length > 0) {
                pool = covert;
            } else {
                pool = available;
            }

            return pool[Math.floor(Math.random() * pool.length)];
        }

        function createItemElement(item) {
            const div = document.createElement('div');
            div.className = `cs-item rarity-${item.rarity}`;
            div.innerHTML = `
                <div class="cs-item-avatar">${item.icon}</div>
                <div class="cs-item-info">
                    <div class="cs-item-name">${item.name}</div>
                    <div class="cs-item-sub">${item.sub || ''}</div>
                </div>
                <div class="cs-rarity-bar"></div>
            `;
            return div;
        }

        function startCaseOpening() {
            if (isSpinning) return;

            const winningSkin = rollWinningSkin();
            if (!winningSkin) {
                showToast("Bạn đã mở khóa trọn bộ tất cả nhân vật!");
                return;
            }

            isSpinning = true;
            document.getElementById('btn-open-case').disabled = true;

            const caseBox = document.getElementById('case-preview-box');
            const caseIcon = document.getElementById('case-icon');
            const rouletteViewport = document.getElementById('roulette-viewport');
            const track = document.getElementById('roulette-track');

            caseIcon.classList.add('case-shaking');

            setTimeout(() => {
                caseIcon.classList.remove('case-shaking');
                caseIcon.textContent = "🔓";
                caseBox.classList.add('spinning-mode');

                rouletteViewport.classList.add('active');

                track.innerHTML = '';
                track.style.transition = 'none';
                track.style.transform = 'translateX(0px)';

                const TOTAL_ITEMS = 62;
                for (let i = 0; i < TOTAL_ITEMS; i++) {
                    if (i === WINNING_INDEX) {
                        track.appendChild(createItemElement(winningSkin));
                    } else {
                        const filler = CSGO_POOL[Math.floor(Math.random() * CSGO_POOL.length)];
                        track.appendChild(createItemElement(filler));
                    }
                }

                const viewportWidth = rouletteViewport.offsetWidth;
                const randomOffset = Math.floor(Math.random() * 64) - 32;
                const targetX = -((WINNING_INDEX * ITEM_CARD_WIDTH) + (ITEM_CARD_WIDTH / 2) - (viewportWidth / 2) + randomOffset);

                let startTime = performance.now();
                const duration = 5800;
                let lastTickCardIndex = -1;

                function trackTicker(now) {
                    if (!isSpinning) return;
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3.2);
                    const currentPos = Math.abs(targetX * easeOut);

                    const currentCardIndex = Math.floor((currentPos + (viewportWidth / 2)) / ITEM_CARD_WIDTH);
                    if (currentCardIndex !== lastTickCardIndex) {
                        sound.playTick();
                        lastTickCardIndex = currentCardIndex;
                    }

                    if (progress < 1) {
                        requestAnimationFrame(trackTicker);
                    }
                }

                setTimeout(() => {
                    requestAnimationFrame(trackTicker);
                    track.style.transition = 'transform 5.8s cubic-bezier(0.12, 0.8, 0.25, 1)';
                    track.style.transform = `translateX(${targetX}px)`;
                }, 80);

                setTimeout(() => {
                    isSpinning = false;
                    document.getElementById('btn-open-case').disabled = false;

                    gameState.inventory.push(winningSkin);
                    saveData();

                    sound.playFanfare(winningSkin.rarity === "Special");
                    showRewardModal(winningSkin);

                    if (getAvailablePool().length === 0) {
                        document.getElementById('status-hint').textContent = "Đã thu thập trọn bộ toàn bộ nhân vật!";
                    }
                }, 6100);

            }, 450);
        }

        function resetCaseView() {
            const rouletteViewport = document.getElementById('roulette-viewport');
            const caseBox = document.getElementById('case-preview-box');
            const caseIcon = document.getElementById('case-icon');

            rouletteViewport.classList.remove('active');
            caseBox.classList.remove('spinning-mode');
            caseIcon.textContent = "📦";
        }

        function showRewardModal(item) {
            const modal = document.getElementById('modal-result');
            const card = document.getElementById('reward-card');
            const badge = document.getElementById('reward-rarity');
            const sub = document.getElementById('reward-sub');

            badge.textContent = item.rarity;
            badge.style.background = item.color;
            badge.style.color = item.rarity === "Special" ? "#000" : "#fff";

            card.style.borderColor = item.color;
            card.style.boxShadow = `0 0 25px ${item.color}66`;

            document.getElementById('reward-avatar').innerHTML = item.icon;
            document.getElementById('reward-title').textContent = item.name;
            document.getElementById('reward-title').style.color = item.color;

            // Hiển thị dòng phụ ở dưới tên
            sub.textContent = item.sub || '';

            modal.style.display = 'flex';
        }

        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';

            if (gameState.inventory.length === 0) {
                grid.innerHTML = '<div style="color: #94a3b8; padding: 30px; text-align: center; width: 100%;">Kho còn trống!<br>Hãy mở hòm để nhận nhân vật.</div>';
                return;
            }

            gameState.inventory.slice().reverse().forEach(item => {
                const el = createItemElement(item);
                grid.appendChild(el);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadData();

            const screenTitle = document.getElementById('screen-title');
            const screenGame = document.getElementById('screen-game');
            const modalResult = document.getElementById('modal-result');
            const modalSettings = document.getElementById('modal-settings');
            const modalInventory = document.getElementById('modal-inventory');

            if (getAvailablePool().length === 0) {
                document.getElementById('status-hint').textContent = "Đã thu thập trọn bộ toàn bộ nhân vật!";
            }

            document.getElementById('btn-play').addEventListener('click', () => {
                sound.playPop();
                screenTitle.style.display = 'none';
                screenGame.style.display = 'flex';
                resetCaseView();
            });

            document.getElementById('btn-back').addEventListener('click', () => {
                sound.playPop();
                screenGame.style.display = 'none';
                screenTitle.style.display = 'block';
                resetCaseView();
            });

            document.getElementById('btn-open-case').addEventListener('click', () => {
                sound.init();
                startCaseOpening();
            });

            document.getElementById('btn-close-result').addEventListener('click', () => {
                sound.playPop();
                modalResult.style.display = 'none';
                resetCaseView();
            });

            document.getElementById('btn-inventory').addEventListener('click', () => {
                sound.playPop();
                renderInventory();
                modalInventory.style.display = 'flex';
            });

            document.getElementById('btn-close-inventory').addEventListener('click', () => {
                sound.playPop();
                modalInventory.style.display = 'none';
            });

            document.getElementById('btn-settings').addEventListener('click', () => {
                sound.playPop();
                modalSettings.style.display = 'flex';
            });

            document.getElementById('btn-close-settings').addEventListener('click', () => {
                sound.playPop();
                modalSettings.style.display = 'none';
            });

            const toggleSFX = document.getElementById('toggle-sfx');
            toggleSFX.addEventListener('click', () => {
                sound.enabled = !sound.enabled;
                toggleSFX.classList.toggle('active', sound.enabled);
                sound.playPop();
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                sound.playPop();
                gameState = { inventory: [] };
                saveData();
                renderInventory();
                document.getElementById('status-hint').textContent = "Nhấn nút để bắt đầu mở hòm!";
                showToast("Đã làm sạch kho đồ!");
            });
        });
    </script>
